restore.unavailable.mount=サーバールートがマウントポイント（独立したボリューム）のため、ディレクトリの入れ替えによる復元はできません。サーバールートをボリューム内のサブフォルダーにしてください。
restore.unavailable.parent=サーバールートの親フォルダーに書き込めないため、復元を準備できません。サーバーの実行ユーザーに親フォルダーへの書き込み権限が必要です。
restore.unavailable.space=サーバールートの隣に展開するための空き容量が足りません。必要: 約 {0}、空き: {1}。
backup.nospace=バックアップ保存先の空き容量が足りません。必要: 約 {0}、空き: {1}。古いバックアップを削除するか、保存制限・保存先を見直してください。
backup.refused=バックアップできないパスが {0} 件あります。名前を変更するか、backup.exclude に追加してください。
backup.refusedmore=ほか {0} 件。サーバーログには、より多く（最大 50 件）を記録しています。
backup.interrupted=サーバーの停止により、実行中のバックアップを中断しました。不完全なファイルは残していません。
list.loading=バックアップの一覧を読み込み中です。完了してからもう一度実行してください。
