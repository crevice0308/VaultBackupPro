# VaultBackup Pro | Paper・Purpur・Spigot（Minecraft 26.2 以降）| Java 25
# 稼働中のファイルを保存するため、全ファイルが完全に同時点の状態とは限りません。
# コピー中に変化し続けたファイルは最後に読み取った内容で保存し、件数を結果と一覧に表示します。
# データベース等は各プラグイン側で書き込みを停止するか、下の exclude で除外してください。
# 厳密な同時点のコピーが必要な場合は、停止中に別の方法でバックアップしてください。

# 表示言語: ja_JP（日本語、既定）または en_US（English）。
# 旧 config.yml にこの項目がなくても日本語になります。
# /backup reload で反映。予約中は表示言語・自動実行/間隔のみ変更できます。
language: ja_JP

# 保存先変更には再起動が必要です。
# backup-directory と state-directory は server-root の外に、別々に配置してください。
# {server} は server-root のフォルダー名に置き換わります（同じ親フォルダーに複数のサーバーを置いても重ならないようにするため）。
# 保存先はサーバーごとに専用にしてください。別のサーバーが使用中の保存先を指定すると、VaultBackup は起動時に自分を無効化します。
storage:
  server-root: .
  backup-directory: ../VaultBackup-{server}-backups
  state-directory: ../VaultBackup-{server}-state

backup:
  compression-level: 6
  include:
    - '**'
  exclude:
    - 'logs/**'
    - 'cache/**'
    - '*.log'
    - '**/*.log'
    - '**/*.lock'
    - '**/session.lock'
    - 'crash-reports/**'
    # Paper console input history changes during ordinary console commands.
    - '.paper/console_history'
    # ext4 などのボリューム直下にある、管理者以外は読めないフォルダー。
    - 'lost+found/**'
  # パターンは「/」区切りで、* は 1 階層内、** は複数階層に一致します。
  # ワイルドカードのないパターン（例: plugins/Example）は、そのフォルダー以下すべてを対象にします。
  # ! による否定、{a,b}、[abc] には対応していません。
  # 読み取れないファイルやフォルダー、シンボリックリンク、特殊ファイル、名前を保存できないファイルなどがあると
  # バックアップ全体を拒否します。該当パスは最大 5 件を表示し（サーバーログには最大 50 件）、残りは件数で示します。

# 処理中または復元予約中の自動実行はスキップし、重複実行しません。
# 起動時（一覧の読み込み後）と、間隔の変更時・自動実行の有効化時は、最新のバックアップから間隔を数えます。
# 稼働中は前回の自動実行（スキップ・失敗を含む）から数え、手動でバックアップを作成しても次回の予定は変わりません。
# バックアップが 1 件もない場合や、起動時点で間隔を過ぎている場合は、起動後に一覧の読み込みが終わってから約 2 分後に実行します。
automatic:
  enabled: true
  interval-minutes: 60

# 0 でその保存制限を無効化します。復元用のアーカイブは保護されます。
# この版は最後の 1 件も自動削除できます。容量上限によっては 0 件になります。
retention:
  max-count: 20
  max-bytes: 53687091200

# バックアップの作成時と、アーカイブの検証時（一覧・/backup verify・復元の予約）に適用する上限。
# 超える場合、バックアップの作成は失敗し、既存のアーカイブは「検証に失敗」として扱われます。
# max-entries はファイルとフォルダーの合計です。復元ヘルパーによる展開は、設定値ではなく下記の最大値で検査します。
# 最大値: 1,000,000 エントリ、1 ファイル 256 GiB、合計 1 TiB、圧縮比 10,000。
limits:
  max-entries: 100000
  max-entry-bytes: 34359738368
  max-total-bytes: 1099511627776
  max-compression-ratio: 2000.0

restore:
  # 同梱ヘルパーを外部保存先へ設置します。稼働中に復元する代替処理はありません。
  helper-jar: ../VaultBackup-{server}-state/helper/vaultbackup-restore.jar
  # 予約後もサーバーは稼働します。自動再起動を無効化し、手動で停止してください。
  # 復元はサーバー停止処理への到達と JVM 完全終了の両方を確認してから実行します。
  # Paper・Purpur ではサーバーが停止中であることを API で確認します。
  # Spigot には確認する API がないため、プラグインの無効化から 10 分以内に JVM が終了した場合を停止とみなします。
  # 停止処理を伴う障害終了も対象となり得ます。自動再起動は行いません。
  # /reload やプラグインの再読み込みを行うと、予約は取り消されます。
  # 停止前の取り消し: /backup restore cancel（適用開始後は不可）

notifications:
  discord:
    enabled: false
    # 明示的に有効化すると処理結果とバックアップ ID を Webhook へ送信します。
    # URL は認証情報です。config.yml のファイル権限を適切に制限してください。
    webhook-url: ''
