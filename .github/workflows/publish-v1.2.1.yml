name: One-time v1.2.1 prerelease
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v1.2.1.yml']
permissions:
  contents: read
concurrency:
  group: vaultbackup-pro-v1.2.1-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'crevice0308/VaultBackupPro' && github.event.before == '6e73ba0821d571305ba78867f0f9bd26ff6ebab2' && startsWith(github.event.head_commit.message, 'Publish VaultBackup Pro 1.2.1 prerelease once (20261110)')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install checksum-pinned official Java 25
        run: bash .github/scripts/setup-java25.sh
      - name: Rebuild, test and verify reviewed artifacts
        run: |
          set -euo pipefail
          bash gradlew --no-daemon clean release check
          (cd build/libs && sha256sum --check ../../release/SHA256SUMS.txt)
          python3 tools/package_release.py dist
          (cd dist && sha256sum --check SHA256SUMS.txt)
          grep -qxF 'd41f71c62e18692587dca4e2c378c93f1051815ce75dd1e8f213d59332bade72  VaultBackupPro-1.2.1.jar' dist/SHA256SUMS.txt
      - name: Create only new v1.2.1 prerelease, verify assets, preserve latest stable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: crevice0308/VaultBackupPro
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/releases/latest --jq .tag_name)" = v1.1.0
          for endpoint in releases/tags/v1.2.1 git/ref/tags/v1.2.1; do
            if gh api "repos/$GH_REPO/$endpoint" > existing.json 2> existing.err; then
              echo 'Refusing to alter an existing v1.2.1 release or tag.' >&2
              exit 1
            fi
            grep -q 'HTTP 404' existing.err || { cat existing.err >&2; exit 1; }
          done
          gh release create v1.2.1 \
            dist/VaultBackupPro-1.2.1.jar \
            dist/VaultBackupPro-1.2.1-plugin.zip \
            dist/VaultBackupPro-1.2.1-source.zip \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title 'VaultBackup Pro 1.2.1 (Pre-release)' \
            --notes-file release/NOTES.md --draft --prerelease --latest=false
          mkdir downloaded-release
          gh release download v1.2.1 --dir downloaded-release
          cmp dist/SHA256SUMS.txt downloaded-release/SHA256SUMS.txt
          (cd downloaded-release && sha256sum --check SHA256SUMS.txt)
          gh release edit v1.2.1 --draft=false --prerelease --latest=false
          test "$(gh api repos/$GH_REPO/releases/tags/v1.2.1 --jq '.prerelease and (.draft | not)')" = true
          test "$(gh api repos/$GH_REPO/releases/latest --jq .tag_name)" = v1.1.0
          test "$(gh api repos/$GH_REPO/git/ref/tags/v1.2.1 --jq .object.sha)" = "$GITHUB_SHA"
