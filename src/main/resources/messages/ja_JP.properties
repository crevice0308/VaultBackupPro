startup.ownerfile=保存先の所有者を記録するファイル {0} が通常のファイルではありません。確認してください。
startup.notapplied=前回予約した復元は適用されませんでした（サーバーデータを入れ替える前に、中断または失敗しました）。現在のサーバーデータは変更されていません。展開途中のデータは削除しました。復元が必要な場合は予約し直してください。
