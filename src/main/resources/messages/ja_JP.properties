startup.encoding=この Java はファイル名を UTF-8 で扱えません（{0}）。ASCII 以外の名前のファイルがあるとバックアップを拒否します。LANG や LC_ALL を C.UTF-8 などの UTF-8 ロケールにしてサーバーを起動してください。
settings.glob=パターン「{0}」は対応していない記法（! ./ {} []）を含むため、文字どおりに照合されます。意図した対象を選択していない可能性があります。
settings.unapplied=config.yml に、まだ反映されていない変更があります。先に /backup reload で反映（または修正）してください。
restore.disablednotice=プラグインが無効化されました（サーバー停止ではありません）。バックアップ {0} の復元予約は適用されません。必要な場合は予約し直してください。
restore.stopnotice=復元予約があります。このサーバープロセスが完全に終了すると、バックアップ {0} がサーバーデータへ適用されます。結果は次回の起動時に表示されます。
restore.stopnotice.disabled=復元予約があります。プラグインが無効化されました。このサーバープロセスが 10 分以内に終了した場合、バックアップ {0} がサーバーデータへ適用されます。
