name: Publish approved v1.0.0 once
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v1.0.0.yml]
permissions:
  contents: read
concurrency:
  group: publish-vaultbackup-v1.0.0
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'crevice0308/VaultBackupPro' && github.event.head_commit.message == 'Publish VaultBackup Pro v1.0.0 (approved one-shot 20261013-1213)'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the checksum-pinned official Java 25 build
        run: bash .github/scripts/setup-java25.sh
      - name: Build and test before publication
        run: bash gradlew --no-daemon clean release check
      - name: Require exactly the previously tested JAR and helper
        run: sha256sum --check release/SHA256SUMS.txt
      - name: Prepare audited public packages
        run: python3 tools/package_release.py dist
      - name: Create only the approved release and verify downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: crevice0308/VaultBackupPro
        run: |
          set -euo pipefail
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo 'Release v1.0.0 already exists; refusing to replace it.' >&2
            exit 1
          fi
          gh release create v1.0.0 \
            dist/VaultBackupPro-1.0.0.jar \
            dist/VaultBackupPro-1.0.0-plugin.zip \
            dist/VaultBackupPro-1.0.0-source.zip \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title 'VaultBackup Pro 1.0.0' \
            --notes-file release/NOTES.md --draft
          mkdir verified-downloads
          gh release download v1.0.0 --dir verified-downloads
          (cd verified-downloads && sha256sum --check SHA256SUMS.txt)
          gh release edit v1.0.0 --draft=false
