name: VaultBackupPro
# Filled in from the Gradle project version when the JAR is built.
version: '${version}'
main: com.vaultbackup.plugin.VaultBackupPlugin
# Oldest server version the plugin loads on. The release JAR is compiled against this API (26.2);
# the same sources are also compiled and link-checked against the current API (26.3). Newer
# versions are not refused, because only public API is used, but nothing has been checked there.
api-version: '26.2'
author: VaultBackup
description: 非同期バックアップと手動停止後の安全なオフライン復元
# Before worlds load: a restore that is still running, or was left unfinished, must be noticed first.
load: STARTUP
commands:
  # Spigot uses this declaration with a CommandExecutor. Paper replaces it with a Brigadier
  # command of the same name, so the labels here must match PaperCommands.LABELS.
  backup:
    description: VaultBackup Pro の管理
    usage: /backup help
    aliases: [vaultbackup]
    # Any one of these is enough to see and run the command; each sub-command checks its own.
    permission: vaultbackup.gui;vaultbackup.create;vaultbackup.list;vaultbackup.restore;vaultbackup.delete;vaultbackup.status;vaultbackup.configure;vaultbackup.reload
permissions:
  vaultbackup.admin:
    description: VaultBackup 管理者権限
    default: op
    children:
      vaultbackup.gui: true
      vaultbackup.create: true
      vaultbackup.list: true
      vaultbackup.restore: true
      vaultbackup.delete: true
      vaultbackup.status: true
      vaultbackup.configure: true
      vaultbackup.reload: true
      vaultbackup.notify: true
  vaultbackup.gui:
    description: 管理画面を開く権限（vaultbackup.admin も必要）
    default: op
  vaultbackup.create:
    default: op
  vaultbackup.list:
    default: op
  vaultbackup.restore:
    default: op
  vaultbackup.delete:
    default: op
  vaultbackup.status:
    default: op
  vaultbackup.configure:
    default: op
  vaultbackup.reload:
    default: op
  vaultbackup.notify:
    description: 自動バックアップの失敗などをゲーム内で受け取る
    default: op
